<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SD-WAN Health Check</title>
<style>
:root{--navy:#07182D;--cyan:#02C8FF;--blue:#0A60FF;--mag:#FF007F;--org:#FF9000;--grn:#1FB86A;--gry:#6B6B6B;
--font:'CiscoSansTT','CiscoSans',-apple-system,'Segoe UI',Arial,sans-serif}
[data-theme=dark]{--bg:#07182D;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.10);
--text:#FFFFFF;--body:#B4B9C0;--muted:#7D8794;--glow:0 0 24px rgba(2,200,255,.12)}
[data-theme=light]{--bg:#F5F7FA;--panel:#FFFFFF;--panel2:#EEF2F6;--line:#DDE3EA;--text:#07182D;--body:#525E6C;--muted:#8A94A1;--glow:0 1px 3px rgba(7,24,45,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--body);font-size:14px}
[data-theme=dark] body{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}
h1,h2,h3,h4{color:var(--text);font-weight:500;margin:0}
a{color:var(--cyan)}
/* frame */
.nav{overflow-y:auto;position:fixed;inset:0 auto 0 0;width:220px;padding:18px 12px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);z-index:5}
.brand{color:var(--text);font-size:16px;margin:0 8px 22px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;margin:2px 0;border:0;border-radius:8px;background:none;color:var(--body);font:inherit;cursor:pointer;text-align:left}
.nav button:hover{background:var(--panel2)}.nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .nsec+.nsec{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.nav .ngrp{margin:4px 10px 4px;font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:600}
.nav button.nsub{padding-left:16px;font-size:13.5px}
.topo{background:#fff;border-radius:10px;padding:10px;overflow:auto}.topo svg{display:block;margin:0 auto}
.topo{cursor:zoom-in}.sitecard h3{display:flex;align-items:center;gap:8px}.sitecard input{width:16px;height:16px;accent-color:var(--cyan)}
.sitecard.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,10,20,.96);display:none;flex-direction:column;padding:18px 24px}
.modal.on{display:flex}.modal .mh{display:flex;align-items:center;gap:10px;color:var(--text);margin-bottom:10px}.modal .mh h3{flex:1;font-size:18px}
.modal .view{flex:1;overflow:auto;background:#fff;border-radius:12px;padding:14px}.modal .view svg{max-width:none!important;transition:width .15s}
.modal .det{max-height:34vh;overflow:auto;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}
.top{position:sticky;top:0;z-index:4;margin-left:220px;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .acct{color:var(--text);font-size:18px}.top .meta{color:var(--muted);font-size:12px}
.top .sp{flex:1}
.top input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;width:220px;font:inherit}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--cyan)}
main{margin-left:220px;padding:22px 24px 60px}
.page{display:none}.page.on{display:block}
.ptitle{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.ptitle h2{font-size:24px}.ptitle span{color:var(--muted)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.subtabs button{border:1px solid var(--line);background:var(--panel);color:var(--body);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.subtabs button.on{border-color:var(--cyan);color:var(--text)}
.sub{display:none}.sub.on{display:block}
/* building blocks */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.g4,.g6{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--glow)}
.card h3{font-size:15px;margin-bottom:10px}.card.click{cursor:pointer}.card.click:hover{border-color:var(--cyan)}
.kpi .v{font-size:30px;color:var(--text);line-height:1.1}.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}
.ring{display:block}.ring text{font-family:var(--font)}
.hero{display:flex;gap:26px;align-items:center}
.cat{display:flex;gap:12px;align-items:center}.cat .n{color:var(--text);font-size:14px}.cat .c{font-size:12px;color:var(--muted);margin-top:3px}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.3px;color:#fff;white-space:nowrap}
.FAIL{background:var(--mag)}.WARN{background:var(--org)}.PASS{background:var(--grn)}.INFO{background:var(--blue)}.NA{background:var(--gry)}.MANUAL{background:#5b6b82}
.hbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.hbar i{display:block;height:100%;background:var(--cyan)}
.sev{font-size:12px;color:var(--muted);white-space:nowrap}.sev.critical{color:var(--mag)}.sev.high{color:var(--org)}
.lvl{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.lvl.Broad{background:rgba(31,184,106,.18);border-color:var(--grn);color:var(--text)}.lvl.Partial{background:rgba(255,144,0,.15);border-color:var(--org);color:var(--text)}
.lvl.Defined{background:rgba(10,96,255,.15);border-color:var(--blue);color:var(--text)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row.click{cursor:pointer}.row.click:hover{background:var(--panel2)}
.row .t{flex:1;color:var(--text)}.row .s{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--panel2)}td.id{white-space:nowrap;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0;white-space:nowrap;background:var(--panel2);color:var(--body)}
.tag.used{background:rgba(10,96,255,.18);color:#7FB0FF}.tag.unused{background:var(--panel2);color:var(--muted)}
.tag.exact{background:rgba(124,77,255,.22);color:#B8A4FF}.tag.shape{background:rgba(2,200,255,.14);color:#7FDBFF}
.tag.warn{background:rgba(255,144,0,.18);color:#FFB45C}.tag.fd{background:var(--panel2);color:var(--body)}
[data-theme=light] .tag.used{color:#0A4FCC}[data-theme=light] .tag.exact{color:#5A2EB8}[data-theme=light] .tag.shape{color:#06739A}[data-theme=light] .tag.warn{color:#9A5B00}
#tdt tr.sel td{background:rgba(10,96,255,.18)}#tdt tr.unused td{color:var(--muted)}#tdt td a{color:var(--cyan)}
.dtbar{display:flex;gap:14px;align-items:center;margin-bottom:10px}.dtbar input[type=search]{flex:0 1 360px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.sec{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}.sec h4{margin:0;padding:8px 12px;background:var(--panel2);font-size:14px}
.slot{display:grid;grid-template-columns:42% 58%;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}.slot.none{color:var(--muted)}
.slot .lb{white-space:pre-wrap}.slot .req{color:var(--mag)}.slot .val a{color:var(--cyan)}
details.feat{border-top:1px solid var(--line);padding:6px 0}details.feat summary{cursor:pointer;font-size:13px}details.feat table{margin:6px 0 4px}
pre.cli{white-space:pre-wrap;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:360px;overflow:auto}
.dgbtns{display:flex;gap:8px;margin:12px 0}.dgbtns .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--body);border-radius:16px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--text);background:var(--panel2)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rm{background:var(--panel2);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;border:1px solid transparent}.rm:hover{border-color:var(--cyan)}
.rm .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}.rm .a{color:var(--text)}.qw{color:var(--cyan);font-size:11px;font-weight:600}
.chev{display:flex;gap:4px;margin:4px 0 16px}
.chev div{flex:1;position:relative;padding:12px 8px 12px 22px;text-align:center;font-size:13px;color:var(--text);cursor:pointer;
 clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);background:var(--panel2)}
.chev div:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:10px}
.chev .done{background:rgba(31,184,106,.28)}.chev .cur{background:var(--org);color:#fff;font-weight:600}
.chev .sel{outline:2px solid var(--cyan);outline-offset:-2px}
.ok{color:var(--grn)}.no{color:var(--mag)}.man{color:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center}
.up{color:var(--grn)}.down{color:var(--mag)}
.muted{color:var(--muted)}.small{font-size:12px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(720px,92vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .2s;z-index:10;overflow:auto;padding:22px}
.drawer.on{transform:none}.drawer .x{float:right}
.drawer h3{font-size:19px;margin:6px 0 12px}.drawer p{line-height:1.5}.drawer .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:16px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}.shade.on{display:block}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html[data-theme]{--bg:#fff;--panel:#fff;--panel2:#F1F4F7;--line:#DDE3EA;--text:#07182D;--body:#525E6C;--muted:#6B6B6B;--glow:none}
  body{background:#fff!important}
  .nav,.top input,.top .btn,.drawer,.shade,.subtabs,.chips,.noprint,.modal,.tbar{display:none!important}
  .top{position:static;margin:0}main{margin:0;padding:8px 0}
  .page,.sub{display:block!important}.page{page-break-before:always}.page:first-child{page-break-before:auto}
  .card,.rm,tr{break-inside:avoid}.b{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sub>.subhead{display:block!important}
}
.subhead{display:none;margin:18px 0 8px;font-size:17px;color:var(--text)}
.tx-bar{display:flex;gap:12px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.tx-bar .tx-q{flex:0 1 320px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:13px}
.tx-bar .tx-clr,.tx-bar .tx-csv{padding:4px 10px;font-size:12px}.tx-bar .tx-csv{margin-left:auto}
tr.tx-f th{padding:4px 6px;cursor:default}
tr.tx-f select,tr.tx-f input{width:100%;min-width:70px;max-width:220px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:11.5px}
th.tx-s:after{content:" ↕";opacity:.35}th.tx-s[data-d=a]:after{content:" ▲";opacity:.9}th.tx-s[data-d=d]:after{content:" ▼";opacity:.9}
tr.tx-out,tr.lf-out{display:none!important}
@media print{.tx-bar,tr.tx-f{display:none}}
.chd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}.chd h3{margin:0}
.lbar{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;padding:5px 4px;border-radius:6px;font-size:12.5px}
.lbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbar .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.lbar .tr i{display:block;height:100%;border-radius:5px}.lbar b{font-weight:600;min-width:44px;text-align:right}
.lbar.click,.col.click,tr.click,.cmpl .click{cursor:pointer}.lbar.click:hover,.col.click:hover{background:var(--panel2)}
.cols6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:190px;padding-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;padding:4px;border-radius:8px;text-align:center}
.col .cbar{width:60%;flex:1;display:flex;align-items:flex-end;background:linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat}
.col .cbar i{display:block;width:100%;border-radius:5px 5px 0 0}
.cmpl{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lkpi .h{font-size:11px;color:var(--cyan);margin-top:4px;opacity:.8}.lkpi:hover{border-color:var(--cyan)}
.catcard{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;font-size:13px}
.catcard .n{display:block;color:var(--text);font-size:13.5px}.catcard .c{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.catcard.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ibtn{width:38px;height:36px;padding:0;display:inline-grid;place-items:center}.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ibtn .i-sun{display:none}[data-theme="light"] .ibtn .i-sun{display:block}[data-theme="light"] .ibtn .i-moon{display:none}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">SD-WAN Health Check<small>Cisco Catalyst SD-WAN</small></div>
  <div id="navbtns"></div>
</nav>
<header class="top">
  <div><div class="acct" id="acct"></div><div class="meta" id="meta"></div></div>
  <div class="sp"></div>
  <input id="q" placeholder="Search findings  ( / )">
  <button class="btn ibtn" id="theme" title="Switch dark / light theme" aria-label="Switch dark / light theme"><svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="btn ibtn" id="print" onclick="window.print()" title="Print (or save as PDF)" aria-label="Print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></button>
  <a class="btn" id="share" style="display:none;text-decoration:none;background:var(--blue,#02C8FF);color:#fff" title="Download one HTML file with only the chosen sections, for the customer">Share with customer</a>
</header>
<main id="main"></main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="tmodal"><div class="mh"><h3 id="tmt"></h3>
<button class="btn" id="tzo" title="Zoom out">−</button><button class="btn" id="tzf" title="Fit to window">Fit</button><button class="btn" id="tzi" title="Zoom in">+</button>
<button class="btn" id="tmx">Export this site (PDF)</button><button class="btn" id="tmc">Close</button></div>
<div class="view" id="tmv"></div><div class="det" id="tmd"></div></div>
<div class="modal" id="dgmodal"><div class="mh"><h3 id="dgt"></h3>
<button class="btn" id="dgfit">Fit / 100%</button><button class="btn" id="dgsvg">Download SVG</button><button class="btn" id="dgc">Close</button></div>
<div class="view" id="dgv"></div><div class="small muted" id="dgl" style="margin-top:8px"></div></div>
<script>// Router + block diagrams for one device template (ported from sdwan-ux2-migrator router.js / blocks.js phase 1).
// All text goes in via textContent (never markup). Drawn on a white canvas in both themes.
(function () {
const T = (v) => v;
const SITE_NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  const e = document.createElementNS(SITE_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) e.setAttribute(k, T(v));
  if (tag === "text" && !(attrs && attrs.fill)) e.setAttribute("fill", T("#0d274d")); // readable in dark mode too
  if (text !== undefined) e.textContent = text;
  return e;
}

function clip(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
const SVGNS = "http://www.w3.org/2000/svg";
const COLOR_FILL = { mpls: "#ede9fe", "biz-internet": "#dbeafe", "public-internet": "#ccfbf1", lte: "#ffedd5",
  "3g": "#ffedd5", metro_ethernet: "#e0e7ff", gold: "#fef3c7", silver: "#f1f5f9", bronze: "#fde68a", custom1: "#fce7f3",
  custom2: "#fce7f3", custom3: "#fce7f3", green: "#dcfce7", blue: "#dbeafe", red: "#fee2e2", default: "#f1f5f9" };

function s(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, T(v));
  if (tag === "text" && !(attrs && attrs.fill)) e.setAttribute("fill", T("#0d274d")); // readable in dark mode too
  if (text !== undefined) e.textContent = text;
  return e;
}

// Fit text to a width; keep the full value in a hover tooltip.
function label(g, x, y, text, opt = {}) {
  const max = Math.floor((opt.w || 300) / (opt.size === 15 ? 8.6 : 7.1));
  const full = String(text);
  const shown = full.length > max ? full.slice(0, max - 1) + "…" : full;
  const t = s("text", { x, y, "font-size": opt.size || 12, "font-weight": opt.bold ? 600 : 400,
    fill: opt.fill || "#0d274d", "text-anchor": opt.anchor || "start" }, shown);
  if (shown !== full) t.append(s("title", {}, full));
  g.append(t);
}

function isVar(v) { return /^\{\{.*\}\}$/.test(String(v)); }

function linesForRouting(rt) {
  const out = [];
  for (const r of rt) {
    if (r.protocol === "BGP") {
      out.push({ t: `BGP AS ${r.as || "?"}${r.router_id ? ` · router-id ${r.router_id}` : ""}`, b: true });
      r.neighbors.forEach((n) => out.push({ t: `  neighbor ${n.address} (AS ${n.remote_as})` }));
      if (r.redistribute.length) out.push({ t: `  redistribute ${r.redistribute.join(", ")}` });
    } else {
      out.push({ t: `${r.protocol}${r.router_id ? ` · router-id ${r.router_id}` : ""}${r.default_originate ? " · originates default" : ""}`, b: true });
      r.areas.forEach((a) => out.push({ t: `  area ${a.area}: ${a.interfaces.join(", ") || "no interfaces"}` }));
      if (r.redistribute.length) out.push({ t: `  redistribute ${r.redistribute.join(", ")}` });
    }
  }
  return out;
}

function linesForRoutes(routes) {
  const name = { static: "route", static6: "ipv6 route", gre: "GRE route", ipsec: "IPsec route", service: "service route" };
  return routes.map((r) => ({ t: `${name[r.kind] || r.kind} ${r.prefix} → ${r.via}` }));
}

function ifaceLine(i) {
  const bits = [i.if_name, i.ip || "no IP"];
  if (i.nat) bits.push(i.nat_value === "yes" ? "NAT" : `NAT ${i.nat_value}`);
  if (i.shutdown) bits.push("shutdown");
  return bits.join(" · ");
}

// A box with a header band and text lines. Returns its height.
function box(g, x, y, w, head, lines, opt = {}) {

function chunk(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }

  only_a: ["#d1495b", "only in A"], only_b: ["#d1495b", "only in B"] };

  var_renamed: "variable renamed", only_a: "only in A", only_b: "only in B" };

function bsv(tag, attrs, text) { return sv(tag, attrs, text); } // sv() lives in site.js
function bclip(s, n) { return clip(s, n); }

// ---------- phase 1: tree ----------
// open: Set of node keys that are expanded. Defaults: root + sections open, everything else closed.
function blockNodes(tree, open) {
  const nodes = [];

    const set = (n.settings || []).filter((s) => s.kind !== "default"), def = (n.settings || []).filter((s) => s.kind === "default");

    }

  const css=`@page{size:A4 landscape;margin:12mm}body{font-family:CiscoSansTT,Arial,sans-serif;color:#525E6C;margin:0}h1{color:#07182D;font-weight:500;font-size:20px;margin:0 0 4px}
   .p{page-break-after:always}.p:last-child{page-break-after:auto}.meta{font-size:11px;color:#8A94A1;margin-bottom:8px}svg{width:100%;height:auto;max-height:120mm}
   table{border-collapse:collapse;width:100%;font-size:9.5px;margin-top:6px}th{background:#07182D;color:#fff;text-align:left;padding:3px 5px}td{border-bottom:1px solid #E3E7EC;padding:3px 5px}
   .sev{color:#E07B00;font-weight:600}.id{font-weight:600;color:#07182D}.foot{font-size:9px;color:#8A94A1;margin-top:6px}`;
  const head=`${esc(D.customer)} · Catalyst SD-WAN site topology · data ${esc(D.collected)} UTC · Cisco Confidential`;
  let body=withOverview&&D.topo_overview?`<div class="p"><h1>Fabric overview</h1><div class="meta">${head}</div>${D.topo_overview}</div>`:"";
  body+=ids.map(id=>{const x=byS[id]; return `<div class="p"><h1>Site ${esc(x.id)} – ${esc(x.role)}</h1><div class="meta">${head} · ${x.edges} router(s) · reaches ${x.remote} site(s)</div>${x.svg}${siteDetails(x)}</div>`;}).join("");
  const fr=document.createElement("iframe"); fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0"; document.body.appendChild(fr);
  const d=fr.contentWindow.document; d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(D.customer)} site topology</title><style>${css}</style></head><body>${body}</body></html>`); d.close();
  setTimeout(()=>{fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(()=>fr.remove(),2000);},300); }
const tch=document.getElementById("tchips");
if(tch) tch.onclick=e=>{const b=e.target.closest("[data-tf]"); if(!b) return; tch.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  const f=b.dataset.tf; $("#tgrid").innerHTML=siteCards(TS.filter(x=>f==="All"||x.role===f||x.health===f||(f==="TLOC ext"&&x.tloc_ext.length)));};
const sf=document.getElementById("sfind"); if(sf) sf.oninput=()=>{const q=sf.value.toLowerCase(); document.querySelectorAll("#stab tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none");};
["ftab","dtab","htab","atab","stab","tdt","tcg","tft","tdv","hdt"].forEach(id=>{const t=document.getElementById(id); if(t) sortable(t);});
smartTables(document);
if(document.getElementById("lictab")) licFilter("all", false);
if(document.getElementById("dtq")){ $("#dtq").oninput=dtFilter; $("#dtdup").onchange=dtFilter; dtFilter(); }

/* ---------- findings filters + search ---------- */
const flt={st:new Set(),sv:new Set(),ct:new Set(),q:""};
function apply(){
  let n=0; document.querySelectorAll("#ftab tbody tr").forEach(r=>{
    const ok=(!flt.st.size||flt.st.has(r.dataset.st))&&(!flt.sv.size||flt.sv.has(r.dataset.sv))&&(!flt.ct.size||flt.ct.has(r.dataset.ct))&&(!flt.q||r.textContent.toLowerCase().includes(flt.q));
    r.style.display=ok?"":"none"; n+=ok;});
  const fc=$("#fcount"); if(fc) fc.textContent=`${n} of ${F.length} checks shown`;  // absent when Findings is not a chosen section
  document.querySelectorAll("#findings .chip").forEach(c=>{const [k,v]=Object.entries(c.dataset)[0]; c.classList.toggle("on",flt[k].has(v));});
}
function setFilter(o){ flt.st=new Set(o.status?[o.status]:[]); flt.sv=new Set(o.severity?[o.severity]:[]); flt.ct=new Set(o.category?[o.category]:[]); apply(); }
document.querySelectorAll("#findings .chip").forEach(c=>c.onclick=()=>{const [k,v]=Object.entries(c.dataset)[0]; flt[k].has(v)?flt[k].delete(v):flt[k].add(v); apply();});
$("#q").oninput=e=>{flt.q=e.target.value.toLowerCase(); if(!$("#findings").classList.contains("on")) go("findings"); apply();};
apply();

/* ---------- theme, keys ---------- */
const th=localStorage.getItem("sdwan-theme"); if(th) document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=n; localStorage.setItem("sdwan-theme",n);};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="Escape"){ closeDrawer(); $("#tmodal").classList.remove("on"); }
  else if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }
  else if(/^[0-9]$/.test(e.key)) { const i=e.key==="0"?9:+e.key-1; if(SHOWN[i]) go(SHOWN[i][0]); }
});
if(D.share_url&&!D.shared){ const sh=$("#share"); sh.href=D.share_url; sh.setAttribute("download",""); sh.style.display=""; }
const h=location.hash.slice(1);
if(h.startsWith("site:")){ go("topology","sites"); setTimeout(()=>openSite(decodeURIComponent(h.slice(5))),50); }
else if(h.startsWith("f:")){ const f=byId[h.slice(2)]; go("findings"); if(f) openFinding(f.id); }
else { const [hp,hs]=(h||"overview").split("/"); go(hp==="categories"||SHOWN.some(p=>p[0]===hp)?hp:SHOWN[0][0], hs); }
})();
</script>
</body>
</html>
